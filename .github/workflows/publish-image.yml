# Builds a container image from the Spring Boot application (Cloud Native
# Buildpacks via the bootBuildImage Gradle task) and publishes it to the
# GitHub Container Registry (ghcr.io), the Docker-image part of GitHub Packages.
#
# Tag policy:
#   push to main  -> ghcr.io/<owner>/rest-api-books:latest
#   push of v1.2.3 -> ghcr.io/<owner>/rest-api-books:1.2.3

name: Publish image to GitHub Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read
  # GITHUB_TOKEN can push packages; no personal access token is needed.
  packages: write

# Queue runs on the same branch/tag instead of running in parallel:
# a push that is mid-upload should never be cancelled halfway.
concurrency:
  group: image-publish-${{ github.ref }}

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    # Never publish an image from a red build: 'check' runs the unit and
    # integration tests before the image is built below.
    - name: Run unit and integration tests
      run: ./gradlew check

    # bootBuildImage reads registry credentials from ~/.docker/config.json,
    # which is exactly the file this login step writes.
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # GHCR only accepts lowercase image names, and GitHub owner names may
    # contain capitals, so the owner is lowercased here. Tag pushes (v1.2.3)
    # publish the version without the 'v' prefix; main publishes 'latest'.
    # IMAGE_SHA_TAG is an additional immutable tag (read by build.gradle) that
    # the deploy job below pins into the GitOps deployment manifest.
    - name: Compute image reference
      run: |
        OWNER="${GITHUB_REPOSITORY_OWNER,,}"
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF_NAME#v}"
        else
          TAG=latest
        fi
        echo "IMAGE_REF=ghcr.io/$OWNER/rest-api-books:$TAG" >> "$GITHUB_ENV"
        echo "IMAGE_SHA_TAG=ghcr.io/$OWNER/rest-api-books:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

    - name: Build and publish image
      run: ./gradlew bootBuildImage --imageName="$IMAGE_REF" --publishImage

  # Pin the freshly published image in the GitOps repository and push the
  # commit. Argo CD watches that repository and syncs the change into the
  # local cluster — this workflow never talks to the cluster directly.
  deploy:

    needs: publish
    runs-on: ubuntu-latest

    steps:
    # GITHUB_TOKEN is restricted to this repository, so the deploy job needs
    # GITOPS_PAT: a fine-grained PAT with Contents: read & write on
    # Orb1979/cicd-kubernetes, stored as a repository secret.
    - name: Checkout GitOps repository
      uses: actions/checkout@v7
      with:
        repository: Orb1979/cicd-kubernetes
        token: ${{ secrets.GITOPS_PAT }}
        path: gitops

    # yq is preinstalled on ubuntu-latest runners.
    - name: Pin image tag in deployment.yaml
      working-directory: gitops
      run: |
        OWNER="${GITHUB_REPOSITORY_OWNER,,}"
        export NEW_IMAGE="ghcr.io/$OWNER/rest-api-books:sha-${GITHUB_SHA::7}"
        yq -i '.spec.template.spec.containers[0].image = strenv(NEW_IMAGE)' k8s/app/deployment.yaml
        echo "deployment.yaml now points at: $(yq '.spec.template.spec.containers[0].image' k8s/app/deployment.yaml)"

    # The commit history of the GitOps repository is the deployment log.
    - name: Commit and push
      working-directory: gitops
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/app/deployment.yaml
        if git diff --cached --quiet; then
          echo "deployment.yaml already up to date, nothing to push"
          exit 0
        fi
        git commit -m "deploy: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rest-api-books:sha-${GITHUB_SHA::7}"
        git push
